name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on master or a tag - it may be creating a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  docs:
    name: Docs (examples match the API, links resolve)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/check_docs.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -q --cov=apikeyrotator --cov-report=term-missing:skip-covered

  release:
    name: Release
    needs: [lint, docs, test]
    # A new version merged to master, or a pushed tag, becomes a tag + GitHub release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
    secrets: inherit

  benchmark:
    name: Benchmark vs base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Benchmark base branch
        id: base
        continue-on-error: true  # the base branch may predate the benchmark or fail on it
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          mkdir -p ../base/benchmarks
          # Same benchmark code for both runs: only the library under test differs
          cp benchmarks/bench_core.py ../base/benchmarks/
          cd ../base
          timeout 1200 python benchmarks/bench_core.py -n 2000 -r 3 --scenario-timeout 120 --save "$GITHUB_WORKSPACE/bench-base.json"
      - name: Benchmark this PR
        run: |
          set -o pipefail
          ARGS="-n 2000 -r 3 --scenario-timeout 120 --save bench-head.json --markdown bench.md"
          if [ -f bench-base.json ]; then
            # Gate only on machine-independent metrics; throughput is shown but not gated
            ARGS="$ARGS --compare bench-base.json --gate deterministic --threshold 10"
          fi
          python benchmarks/bench_core.py $ARGS | tee bench.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Benchmark"
            echo
            cat bench.md 2>/dev/null || echo "no benchmark output"
            echo
            echo "<details><summary>Comparison with the base branch</summary>"
            echo
            echo '```'
            sed -n '/^Comparison with baseline/,$p' bench.txt 2>/dev/null || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmark-results
          path: |
            bench-base.json
            bench-head.json
            bench.md
            bench.txt
          if-no-files-found: ignore
