name: Backfill release 0.8.0

# One-off: 0.8.0 was merged before releases were automated, so it has no tag.
# Creates the tag and the GitHub release on the 0.8.0 commit (not marked as latest).
# Idempotent; removed again in the next commit.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/backfill-0.8.0.yml"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      ref: a0f5b7a18dcc23f77b52c34edc25273b33ccdb34
      latest: false
    permissions:
      contents: write
      id-token: write
    secrets: inherit
