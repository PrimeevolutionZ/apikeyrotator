name: Benchmark history

# Runs the benchmark on every change of the library on master and publishes the
# results: a table in the run summary, and history charts on GitHub Pages
# (https://primeevolutionz.github.io/apikeyrotator/bench/).
#
# The history data is stored in the gh-pages branch (created on the first run);
# the site is deployed with GitHub Actions (Settings -> Pages -> Source: GitHub Actions).

on:
  push:
    branches: [master]
    paths:
      - "apikeyrotator/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write  # push the history to the gh-pages branch
  pages: write     # deploy the site
  id-token: write

concurrency:
  group: benchmark-history
  cancel-in-progress: false

jobs:
  publish:
    name: Run and publish benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"

      - name: Run benchmark
        run: |
          timeout 1800 python benchmarks/bench_core.py -n 5000 -r 3 --scenario-timeout 120 \
            --save bench.json --markdown bench.md --export-github bench

      - name: Job summary
        run: |
          {
            echo "## Benchmark"
            echo
            echo "Throughput and latency depend on the runner; calls/req, sleep and memory are deterministic."
            echo
            cat bench.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the gh-pages branch on first run
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            empty_tree=$(git mktree < /dev/null)
            commit=$(git commit-tree "$empty_tree" -m "Initialize gh-pages for benchmark history")
            git push origin "$commit:refs/heads/gh-pages"
          fi

      - name: Publish throughput history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Throughput (higher is better)
          tool: customBiggerIsBetter
          output-file-path: bench-bigger.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Shared runners are noisy: only flag big throughput drops
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Publish latency, resilience and memory history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Latency, upstream calls, waiting and memory (lower is better)
          tool: customSmallerIsBetter
          output-file-path: bench-smaller.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Prepare the site from the gh-pages branch
        run: |
          git fetch origin gh-pages
          mkdir site
          git --work-tree=site checkout origin/gh-pages -- .
          # The charts live in bench/; send the site root there
          if [ ! -f site/index.html ]; then
            echo '<!doctype html><meta http-equiv="refresh" content="0; url=bench/"><a href="bench/">Benchmark history</a>' > site/index.html
          fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmark-results
          path: |
            bench.json
            bench.md
            bench-bigger.json
            bench-smaller.json
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}bench/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
